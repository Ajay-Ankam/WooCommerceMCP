# Customises the Traefik bundled with k3s (applied at install, before any
# certificate exists):
#   sudo cp deploy/k3s/traefik-config.yaml /var/lib/rancher/k3s/server/manifests/
# externalTrafficPolicy Local keeps the real client IP, which the gateway's
# login throttle relies on (X-Forwarded-For from Traefik).
# No HTTP-to-HTTPS redirect yet: it is enabled by traefik-config-redirect.yaml
# only after both certificates are issued.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
