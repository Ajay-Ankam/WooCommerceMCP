# Let's Encrypt production issuer for the platform Ingresses
# (values-prod.yaml: ingress.tls.clusterIssuer). Requires cert-manager.
# Use it only after letsencrypt-staging has issued both certificates: failed
# production attempts count against Let's Encrypt rate limits.
# The contact email is substituted at apply time and never committed:
#   export ACME_EMAIL=you@example.org
#   envsubst '$ACME_EMAIL' < deploy/k3s/cluster-issuer.yaml | kubectl apply -f -
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            # The solver gets its own Ingress, served by Traefik on port 80.
            ingressClassName: traefik
