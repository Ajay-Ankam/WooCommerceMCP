# Traefik ingress controller for the local Kind cluster only. k3s already ships
# Traefik with an IngressClass named "traefik", so the platform chart uses the
# same class name in both environments.
#
#   helm upgrade --install traefik oci://ghcr.io/traefik/helm/traefik --version 42.1.3 `
#     -n traefik --create-namespace --skip-crds -f deploy/traefik/values-kind.yaml
#   kubectl port-forward -n traefik svc/traefik 8080:80
#
# Standard Kubernetes Ingress objects only: no Traefik CRDs, no Gateway API.

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false
gatewayClass:
  enabled: false

# Kind publishes no host ports 80/443; reach Traefik with kubectl port-forward.
service:
  spec:
    type: ClusterIP

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi
