{{- $root := . }}
{{- $secretName := .Values.mcpBusiness.auth.existingSecret | default (printf "%s-mcp-business-auth" .Release.Name) }}
{{- range $server, $config := .Values.mcpBusiness.servers }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $root.Release.Name }}-mcp-{{ $server }}
  labels:
    app.kubernetes.io/name: mcp-{{ $server }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: mcp-upstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-{{ $server }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-{{ $server }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: mcp-upstream
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-{{ $server }}
          image: {{ include "urumi.image" (list "mcpBusiness" $root.Values.mcpBusiness.image) | quote }}
          imagePullPolicy: {{ $root.Values.mcpBusiness.image.pullPolicy }}
          command: ["node", "apps/mcp-business/dist/{{ $server }}/main.js"]
          ports:
            - name: http
              containerPort: {{ $root.Values.mcpBusiness.service.port }}
          env:
            - name: PORT
              value: {{ $root.Values.mcpBusiness.service.port | quote }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $server }}-token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            # The 1s default restarted healthy pods when the node was briefly busy.
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-mcp-{{ $server }}
  labels:
    app.kubernetes.io/name: mcp-{{ $server }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-{{ $server }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: {{ $root.Values.mcpBusiness.service.port }}
      targetPort: http
{{- end }}
{{- end }}
