
{{- if .Values.wordpress.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ .Release.Name }}-mariadb:{{ .Values.mariadb.service.port }}"

            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.database | quote }}

            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.username | quote }}

            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.auth.existingSecret }}
                  key: user-password

            {{- with .Values.wordpress.siteUrl }}
            {{- if not (regexMatch "^https?://[A-Za-z0-9.-]+(:[0-9]+)?$" .) }}
            {{- fail "wordpress.siteUrl must be scheme://host[:port] with no path or trailing slash" }}
            {{- end }}
            # Public URL pinned in wp-config (WP_HOME/WP_SITEURL) instead of the
            # database, so each environment sets its own and removing it restores
            # the stored URL. The image evaluates this PHP, hence the strict check.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ . }}');
                define('WP_SITEURL', '{{ . }}');
            {{- end }}

          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress-data
{{- end }}
