{{- if not .Values.mcpBusiness.auth.existingSecret }}
{{- $name := printf "%s-mcp-business-auth" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: mcp-business
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Keep generated tokens if the release is uninstalled and reinstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $server := list "utility" "analytics" }}
  {{- $key := printf "%s-token" $server }}
  {{- if and $existing (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
