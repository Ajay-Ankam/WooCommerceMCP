
{{- if .Values.mariadb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-mariadb
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: mariadb
          image: {{ include "urumi.image" (list "mariadb" .Values.mariadb.image) | quote }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: mysql
              containerPort: 3306

          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}

            - name: MARIADB_USER
              value: {{ .Values.mariadb.username | quote }}

            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.auth.existingSecret | quote }}
                  key: root-password

            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.auth.existingSecret | quote }}
                  key: user-password

          
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - healthcheck.sh --connect --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - healthcheck.sh --connect --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - healthcheck.sh --connect
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3


          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size | quote }}
{{- end }}
