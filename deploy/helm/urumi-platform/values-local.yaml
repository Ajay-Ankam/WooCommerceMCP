# Local Kind cluster. Traefik is installed separately (deploy/traefik) and
# reached through a port-forward, because Kind publishes no ports 80/443:
#   kubectl port-forward -n traefik svc/traefik 8080:80
# *.localtest.me resolves to 127.0.0.1, so no hosts-file edits are needed:
#   http://ajay.localtest.me:8080   dashboard, /api, /mcp, /invite
#   http://store.localtest.me:8080  storefront

global:
  storageClass: standard

mariadb:
  persistence:
    size: 2Gi

wordpress:
  service:
    port: 80
  persistence:
    size: 2Gi
  # Must match the browser URL exactly (including the port-forward port).
  siteUrl: http://store.localtest.me:8080

mcpBusiness:
  image:
    # Images are loaded with `kind load docker-image`, never pulled.
    pullPolicy: Never

gateway:
  image:
    # Loaded with `kind load docker-image ajay-gateway:dev --name ajay`.
    pullPolicy: Never
  # Local cluster only; the password comes from the ajay-gateway Secret.
  bootstrapAdminEmail: admin@ajay.local
  # Plain HTTP locally; values-prod.yaml enables Secure cookies behind TLS.
  cookieSecure: false

mcpWoocommerce:
  image:
    tag: "0.2.0"
    # Loaded with `kind load docker-image ajay-mcp-woocommerce:0.2.0 --name ajay`.
    pullPolicy: Never
  # Store access uses the chart default: the in-cluster WordPress Service over
  # HTTP with X-Forwarded-Proto: https. To fall back to the legacy HTTPS proxy:
  #   store: {url: https://ajay-https-proxy.ajay-store.svc.cluster.local,
  #           forwardedProto: "", trustedCaSecret: ajay-local-tls}

ingress:
  enabled: true
  gateway:
    host: ajay.localtest.me
  store:
    host: store.localtest.me
