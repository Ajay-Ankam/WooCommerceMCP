
global:
  storageClass: standard

mariadb:
  enabled: true

  image:
    repository: mariadb
    tag: "11.4"

  database: wordpress
  username: wordpress

  auth:
    existingSecret: ajay-mariadb-auth

  service:
    port: 3306

  persistence:
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi


wordpress:
  enabled: true

  image:
    repository: wordpress
    tag: "php8.3-apache"

  service:
    port: 80

  persistence:
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

# Utility and Sales Analytics MCP servers (one image, two Deployments).
mcpBusiness:
  image:
    repository: ajay-mcp-business
    tag: "dev"
    pullPolicy: IfNotPresent

  # Bearer tokens the gateway uses to call these servers. Leave empty to let
  # the chart generate a Secret once and keep it across upgrades.
  auth:
    existingSecret: ""

  service:
    port: 3002

  servers:
    utility:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 192Mi
    analytics:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
